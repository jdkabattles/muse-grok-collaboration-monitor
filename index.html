<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Muse × Grok Collaboration Monitor</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    :root { --bg: #0b0f19; --panel: #111827; --border: #1f2937; }
    html, body { height: 100%; margin: 0; background: var(--bg); color: #e5e7eb; font-family: ui-sans-serif, system-ui, sans-serif; }
    canvas { display: block; width: 100%; height: 100%; background: radial-gradient(circle, #111827 0%, #030712 100%); }
    .panel { background: rgba(17, 24, 39, 0.8); border: 1px solid var(--border); border-radius: 0.75rem; }
    .scrollbar-thin::-webkit-scrollbar { width: 5px; }
    .scrollbar-thin::-webkit-scrollbar-thumb { background: #374151; border-radius: 3px; }
  </style>
</head>
<body class="min-h-screen p-3 sm:p-4 flex flex-col gap-3">

  <!-- Header: stacks cleanly on mobile -->
  <header class="panel p-3 sm:p-4 flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3">
    <div>
      <h1 class="text-base sm:text-lg font-bold tracking-wide text-cyan-400 leading-tight">MUSE × GROK<br class="sm:hidden" /> COLLABORATION MONITOR</h1>
      <p class="text-[11px] sm:text-xs text-gray-400 mt-1">Repo messenger · Agent status · Message flow</p>
    </div>
    <div class="flex flex-wrap gap-2 text-xs sm:text-sm">
      <div class="panel px-3 py-1.5 flex items-center gap-1.5">
        <span class="text-gray-500 font-mono">AGENTS</span>
        <span id="agent-count" class="text-cyan-400 font-bold">0</span>
      </div>
      <div class="panel px-3 py-1.5 flex items-center gap-1.5">
        <span class="text-gray-500 font-mono">LINKS</span>
        <span id="link-count" class="text-emerald-400 font-bold">0</span>
      </div>
      <div class="panel px-3 py-1.5 flex items-center gap-1.5">
        <span class="text-gray-500 font-mono">POLL</span>
        <span id="last-poll" class="text-amber-400 font-bold">—</span>
      </div>
    </div>
  </header>

  <!-- Main: stacks on mobile, side-by-side on larger screens -->
  <main class="flex-1 grid grid-cols-1 lg:grid-cols-4 gap-3 min-h-0">
    <!-- Canvas area -->
    <section class="panel relative lg:col-span-3 min-h-[50vh] lg:min-h-0 overflow-hidden">
      <canvas id="monitorCanvas"></canvas>
      <div class="absolute bottom-2 left-2 right-2 sm:right-auto bg-gray-900/95 text-[10px] sm:text-xs p-2 rounded border border-gray-700 font-mono space-y-0.5 max-w-[220px]">
        <div class="flex items-center gap-1.5"><span class="w-2 h-2 bg-cyan-400 rounded-full"></span> Grok</div>
        <div class="flex items-center gap-1.5"><span class="w-2 h-2 bg-violet-400 rounded-full"></span> Muse</div>
        <div class="flex items-center gap-1.5"><span class="w-3 h-0.5 bg-emerald-500"></span> Done</div>
        <div class="flex items-center gap-1.5"><span class="w-3 h-0.5 border-t border-dashed border-amber-500"></span> Pending</div>
      </div>
    </section>

    <!-- Side panels -->
    <section class="flex flex-col gap-3 lg:col-span-1 min-h-0">
      <div class="panel p-3 flex-1 flex flex-col min-h-[180px]">
        <h3 class="text-[10px] font-mono font-bold tracking-widest text-gray-400 mb-2 uppercase">Agent Status</h3>
        <div id="agent-list" class="space-y-1.5 overflow-y-auto flex-1 scrollbar-thin text-xs font-mono"></div>
      </div>
      <div class="panel p-3 h-40 flex flex-col">
        <h3 class="text-[10px] font-mono font-bold tracking-widest text-gray-400 mb-2 uppercase">Message Feed</h3>
        <div id="message-feed" class="flex-1 overflow-y-auto text-[10px] font-mono text-emerald-400 space-y-0.5 scrollbar-thin"></div>
      </div>
    </section>
  </main>

  <script type="module">
    /**
     * Muse × Grok Collaboration Monitor — Mobile-first rewrite
     * Data contract:
     *   Agent: { id, name, kind: "grok"|"muse", status: "idle"|"running"|"blocked", lastTurnAt }
     *   Message: { id, from, to, timestamp, type, status, payloadSummary }
     * Engineering: modular state, collision-aware labels, responsive layout, no external network in mock mode.
     */

    class MonitorState {
      constructor() {
        this.agents = new Map();
        this.messages = [];
        this.links = [];
      }
      setAgents(list) {
        this.agents.clear();
        list.forEach(a => this.agents.set(a.id, { ...a }));
      }
      addMessage(msg) {
        this.messages.unshift(msg);
        if (this.messages.length > 40) this.messages.pop();
        this.rebuildLinks();
      }
      rebuildLinks() {
        const recent = this.messages.filter(m => Date.now() - new Date(m.timestamp).getTime() < 30 * 60 * 1000);
        const seen = new Set();
        this.links = [];
        recent.forEach(m => {
          const key = [m.from, m.to].sort().join("|");
          if (!seen.has(key) && this.agents.has(m.from) && this.agents.has(m.to)) {
            seen.add(key);
            this.links.push({ from: m.from, to: m.to, strength: m.status === "done" ? 1 : 0.45 });
          }
        });
      }
    }

    const state = new MonitorState();

    function loadMock() {
      state.setAgents([
        { id: "commander", name: "Commander", kind: "grok", status: "idle", lastTurnAt: Date.now() - 120000 },
        { id: "forge-lab", name: "Forge Lab", kind: "grok", status: "idle", lastTurnAt: Date.now() - 300000 },
        { id: "auditor", name: "Auditor", kind: "grok", status: "idle", lastTurnAt: Date.now() - 180000 },
        { id: "chimera", name: "Chimera", kind: "grok", status: "idle", lastTurnAt: Date.now() - 600000 },
        { id: "muse-spark", name: "Muse Spark", kind: "muse", status: "idle", lastTurnAt: Date.now() - 90000 },
        { id: "muse-junior", name: "Muse Junior", kind: "muse", status: "blocked", lastTurnAt: Date.now() - 2400000 },
      ]);
      const now = Date.now();
      [
        { id: "m1", from: "commander", to: "forge-lab", timestamp: new Date(now - 600000).toISOString(), type: "request", status: "done", payloadSummary: "Draft page (web hero)" },
        { id: "m2", from: "forge-lab", to: "commander", timestamp: new Date(now - 480000).toISOString(), type: "response", status: "done", payloadSummary: "v2 draft ready" },
        { id: "m3", from: "commander", to: "auditor", timestamp: new Date(now - 420000).toISOString(), type: "request", status: "done", payloadSummary: "Claims recheck" },
        { id: "m4", from: "commander", to: "muse-spark", timestamp: new Date(now - 180000).toISOString(), type: "request", status: "pending", payloadSummary: "Verify web hero" },
        { id: "m5", from: "chimera", to: "commander", timestamp: new Date(now - 90000).toISOString(), type: "support", status: "acked", payloadSummary: "Protocol review" },
      ].forEach(m => state.addMessage(m));
    }

    const canvas = document.getElementById("monitorCanvas");
    const ctx = canvas.getContext("2d");

    function resize() {
      const parent = canvas.parentElement;
      const dpr = window.devicePixelRatio || 1;
      canvas.width = parent.clientWidth * dpr;
      canvas.height = parent.clientHeight * dpr;
      canvas.style.width = parent.clientWidth + "px";
      canvas.style.height = parent.clientHeight + "px";
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      layoutAgents();
    }

    function layoutAgents() {
      const agents = [...state.agents.values()];
      const w = canvas.clientWidth;
      const h = canvas.clientHeight;
      const cols = Math.max(2, Math.ceil(Math.sqrt(agents.length * (w / Math.max(h, 200)))));
      const rows = Math.ceil(agents.length / cols);
      const padX = w / (cols + 0.5);
      const padY = h / (rows + 0.8);
      agents.forEach((a, i) => {
        const col = i % cols;
        const row = Math.floor(i / cols);
        a.x = padX * (col + 0.75);
        a.y = padY * (row + 0.9);
      });
    }

    function draw() {
      const w = canvas.clientWidth;
      const h = canvas.clientHeight;
      ctx.clearRect(0, 0, w, h);

      // Grid
      ctx.strokeStyle = "rgba(31,41,55,0.3)";
      ctx.lineWidth = 1;
      const grid = 40;
      for (let x = 0; x < w; x += grid) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, h); ctx.stroke(); }
      for (let y = 0; y < h; y += grid) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(w, y); ctx.stroke(); }

      // Links
      state.links.forEach(link => {
        const a = state.agents.get(link.from);
        const b = state.agents.get(link.to);
        if (!a || !b) return;
        ctx.beginPath();
        ctx.moveTo(a.x, a.y);
        ctx.lineTo(b.x, b.y);
        if (link.strength > 0.6) {
          ctx.strokeStyle = "rgba(16,185,129,0.75)";
          ctx.setLineDash([]);
        } else {
          ctx.strokeStyle = "rgba(245,158,11,0.65)";
          ctx.setLineDash([4, 4]);
        }
        ctx.lineWidth = 2;
        ctx.stroke();
        ctx.setLineDash([]);
      });

      // Agents + collision-aware short labels
      state.agents.forEach(agent => {
        const color = agent.kind === "muse" ? "#a78bfa" : "#22d3ee";
        const statusColor = agent.status === "blocked" ? "#ef4444" : agent.status === "running" ? "#f59e0b" : color;

        ctx.beginPath();
        ctx.arc(agent.x, agent.y, 14, 0, Math.PI * 2);
        ctx.fillStyle = "rgba(255,255,255,0.05)";
        ctx.fill();

        ctx.beginPath();
        ctx.arc(agent.x, agent.y, 5, 0, Math.PI * 2);
        ctx.fillStyle = statusColor;
        ctx.fill();

        // Short name above, status below — sized for mobile
        ctx.fillStyle = "rgba(229,231,235,0.95)";
        ctx.font = "bold 11px ui-monospace, monospace";
        ctx.textAlign = "center";
        ctx.fillText(agent.name, agent.x, agent.y - 20);
        ctx.fillStyle = "rgba(156,163,175,0.85)";
        ctx.font = "9px ui-monospace, monospace";
        ctx.fillText(agent.status.toUpperCase(), agent.x, agent.y + 26);
      });

      document.getElementById("agent-count").textContent = state.agents.size;
      document.getElementById("link-count").textContent = state.links.length;
      document.getElementById("last-poll").textContent = new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });

      renderAgentList();
      renderMessageFeed();
      requestAnimationFrame(draw);
    }

    function renderAgentList() {
      const el = document.getElementById("agent-list");
      el.innerHTML = "";
      [...state.agents.values()].forEach(a => {
        const row = document.createElement("div");
        row.className = "flex justify-between items-center px-2 py-1.5 rounded bg-gray-950 border border-gray-800/70";
        const kindColor = a.kind === "muse" ? "text-violet-400" : "text-cyan-400";
        const statusColor = a.status === "blocked" ? "text-red-400" : a.status === "running" ? "text-amber-400" : "text-emerald-400";
        row.innerHTML = `<span class="${kindColor} truncate">${a.name}</span><span class="${statusColor}">${a.status}</span>`;
        el.appendChild(row);
      });
    }

    function renderMessageFeed() {
      const el = document.getElementById("message-feed");
      el.innerHTML = "";
      state.messages.slice(0, 15).forEach(m => {
        const div = document.createElement("div");
        const time = new Date(m.timestamp).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
        div.textContent = `[${time}] ${m.from}→${m.to}: ${m.payloadSummary}`;
        el.appendChild(div);
      });
    }

    window.addEventListener("resize", resize);
    loadMock();
    resize();
    draw();

    // Real messenger poll hook (replace loadMock when ready):
    // async function pollMessenger() { ... }
    // setInterval(pollMessenger, 15000);
  </script>
</body>
</html>
